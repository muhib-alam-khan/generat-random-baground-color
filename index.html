<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Background Color Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.5s ease;
            color: #333;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            color: #444;
        }

        .color-display {
            font-size: 1.5em;
            margin: 20px 0;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 2px solid #ddd;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        #colorBtn {
            background-color: #007bff;
            color: white;
        }

        #colorBtn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        #resetBtn {
            background-color: #6c757d;
            color: white;
        }

        #resetBtn:hover {
            background-color: #545b62;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Random Background Color Generator</h1>
        <div class="color-display" id="colorDisplay">rgb(255, 255, 255)</div>
        <div class="buttons">
            <button id="colorBtn">Generate Color</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <script>
        const button = document.getElementById("colorBtn");
        const resetBtn = document.getElementById("resetBtn");
        const colorDisplay = document.getElementById("colorDisplay");

        function getRandomColor() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return { r, g, b, rgb: `rgb(${r}, ${g}, ${b})` };
        }

        function updateBackground(color) {
            document.body.style.backgroundColor = color.rgb;
            colorDisplay.textContent = color.rgb;
        }

        button.addEventListener("click", function () {
            const randomColor = getRandomColor();
            updateBackground(randomColor);
        });

        resetBtn.addEventListener("click", function () {
            const defaultColor = { r: 255, g: 255, b: 255, rgb: 'rgb(255, 255, 255)' };
            updateBackground(defaultColor);
        });

        // Initialize with default color
        updateBackground({ r: 255, g: 255, b: 255, rgb: 'rgb(255, 255, 255)' });
    </script>

</body>

</html>
